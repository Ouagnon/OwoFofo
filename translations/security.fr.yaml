"An authentication exception occurred.": "Une erreur d'authentification est survenue."
"Authentication credentials could not be found.": "Aucune information de connexion n'a été trouvée."
"Authentication request could not be processed due to a system problem.": "La connexion n'a pas pu être traitée à cause d'un problème technique."
"Invalid credentials.": "Pseudo ou mot de passe incorrect."
"Cookie has already been used by someone else.": "Votre session n'est plus valide. Merci de vous reconnecter."
"Not privileged to request the resource.": "Vous n'avez pas les droits nécessaires pour accéder à cette page."
"Invalid CSRF token.": "La session a expiré. Merci de réessayer."
"No authentication provider found to support the authentication token.": "Aucune méthode de connexion compatible n'a été trouvée."
"No session available, it either timed out or cookies are not enabled.": "Aucune session active. Vérifiez vos cookies et reconnectez-vous."
"No token could be found.": "Aucun jeton d'authentification n'a été trouvé."
"Username could not be found.": "Ce compte est introuvable."
"Account has expired.": "Ce compte a expiré."
"Credentials have expired.": "Votre mot de passe a expiré."
"Account is disabled.": "Ce compte est désactivé."
"Account is locked.": "Ce compte est temporairement verrouillé."
"Too many failed login attempts, please try again later.": "Trop de tentatives de connexion. Réessayez dans quelques instants."
"Too many failed login attempts, please try again in %minutes% minute.": "Trop de tentatives de connexion. Réessayez dans %minutes% minute."
"Too many failed login attempts, please try again in %minutes% minutes.": "Trop de tentatives de connexion. Réessayez dans %minutes% minutes."
