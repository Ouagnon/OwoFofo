security:
    password_hashers:
        App\Entity\Joueur: 'auto'

    providers:
        joueurs:
            entity:
                class: App\Entity\Joueur
                property: nom

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: joueurs
            form_login:
                login_path: app_compte_connexion
                check_path: app_compte_connexion
                enable_csrf: true
                default_target_path: app_home
            logout:
                path: app_compte_deconnexion
                target: app_home

    access_control:
        - { path: ^/tournois/creer, roles: ROLE_USER }
        - { path: ^/tournois/.+/modifier, roles: ROLE_USER }
        - { path: ^/tournois/.+/jouer, roles: ROLE_USER }
        - { path: ^/tournois/.+/lancer, roles: ROLE_USER }
        - { path: ^/tournois/.+/supprimer, roles: ROLE_USER }
        - { path: ^/parties, roles: ROLE_USER }
        - { path: ^/compte/(connexion|inscription)$, roles: PUBLIC_ACCESS }
        - { path: ^/compte, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            App\Entity\Joueur:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
